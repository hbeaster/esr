<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>ESR · Engineering workspace</title><style>body{margin:0;background:#f4f6f8;font-family:Inter,ui-sans-serif,system-ui,sans-serif}.demo{padding:8px 20px;background:#eaecf0;color:#364458;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 16px;font-size:12px;line-height:1.4;border-bottom:1px solid #ccd3dc}.demo-status{display:flex;align-items:center;flex:1 1 320px;flex-wrap:wrap;gap:8px;min-width:min(100%,280px)}.demo-controls{display:flex;align-items:center;flex:0 0 auto;gap:0;margin-left:auto;padding:2px;background:#fff;border:1px solid #c5ccd6;border-radius:10px;box-shadow:0 1px 1px rgba(15,23,42,.04)}.demo-identity{display:flex;align-items:center;gap:8px;min-width:0;margin-left:2px;padding:0 4px 0 10px;border-left:1px solid #e4e8ee;color:#5c6b7e;font-weight:600}.demo-identity span{white-space:nowrap}.demo select{box-sizing:border-box;width:236px;max-width:38vw;height:30px;padding:0 4px 0 0;border:0;border-radius:8px;background:transparent;font:inherit;color:#1f2a37}.simulated-toggle{box-sizing:border-box;height:30px;padding:0 12px;border:0;border-radius:8px;background:transparent;font:inherit;font-weight:600;color:#1f2a37;cursor:pointer;white-space:nowrap}.simulated-toggle:hover{background:#f1f4f8}.simulated-toggle:disabled{cursor:wait;opacity:.6}.simulated-toggle[aria-pressed=true]{background:#fef3c7;color:#78350f}.simulated-toggle:focus-visible,.demo select:focus-visible{outline:2px solid #2563eb;outline-offset:1px}.simulated-badge{padding:3px 8px;border:1px solid #b45309;border-radius:999px;background:#fef3c7;color:#78350f;font-weight:700;white-space:nowrap}.simulated-badge[hidden]{display:none}@media(max-width:650px){.demo{padding:10px 16px}}@media(max-width:480px){.demo-controls{width:100%;margin-left:0;flex-wrap:wrap;row-gap:2px}.simulated-toggle{width:100%}.demo-identity{flex:1 1 100%;margin-left:0;padding:4px 6px 2px;border-left:0;border-top:1px solid #e4e8ee}.demo select{width:auto;flex:1 1 auto;max-width:none}}</style></head><body><div class="demo"><div class="demo-status"><span><strong>DEMO ENVIRONMENT</strong> &nbsp; Synthetic data · Simulated signatures · Resets on restart</span></div><div class="demo-controls"><label class="demo-identity"><span>Acting as</span><select id="identity" aria-label="Demo identity"></select></label></div></div><esr-workspace api-base="/api"></esr-workspace><script type="module" src="/host/main.ts"></script></body></html>
