services:
  esr:
    build: .
    image: esr-demo:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # JCN lookups go to the CRACN API; here, the mock built from cracn_openapi.json.
      Cracn__BaseUrl: http://cracn-mock:4010
      # Assistant chat, read from .env (see .env.example). An empty key serves the labeled mock.
      Chat__ApiKey: ${CHAT_API_KEY:-}
      Chat__BaseUrl: ${CHAT_BASE_URL:-https://api.openai.com/v1}
      Chat__Model: ${CHAT_MODEL:-gpt-4o-mini}
    depends_on:
      - cracn-mock
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  cracn-mock:
    build:
      context: .
      dockerfile: mocks/cracn/Dockerfile
    image: cracn-mock:local
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
