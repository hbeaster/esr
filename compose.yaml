services:
  esr:
    build: .
    image: esr-demo:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      EsrAi__BaseUrl: ${EsrAi__BaseUrl:-}
      EsrAi__Model: ${EsrAi__Model:-}
      EsrAi__ApiKey: ${EsrAi__ApiKey:-}
      EsrAi__CompletionsPath: ${EsrAi__CompletionsPath:-chat/completions}
      EsrAi__AuthHeader: ${EsrAi__AuthHeader:-Authorization}
      EsrAi__AuthScheme: ${EsrAi__AuthScheme:-Bearer}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
